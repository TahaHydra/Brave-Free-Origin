name: Release

# Push a tag such as v2.0 and this runs the full CI (the same workflow that runs on pull requests, so the two can
# never drift apart), builds the portable zip, checks that the tag matches the version inside the app, and publishes
# the release with the zip and its SHA-256 sums. The one-line installer (install\bfo.ps1) downloads
# Brave-Free-Origin.zip from the latest release and verifies it against the checksum GitHub records for that exact
# file, so the asset name must not change.
#
# Dry run: start this workflow by hand (Actions > Release > Run workflow) with the tag left empty, or with "dry run"
# ticked. Everything runs except the final publish step.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, for example v2.0. Leave empty for a dry run of the selected branch.'
        required: false
      dry_run:
        description: 'Run every check and build the zip, but do not publish'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  checks:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Work out the tag and check it matches the app
        id: version
        shell: pwsh
        run: |
          $source = Get-Content 'Brave-Free-Origin.ps1' -Raw
          if ($source -notmatch "AppVersion\s*=\s*'([^']+)'") { throw 'AppVersion not found in Brave-Free-Origin.ps1.' }
          $appVersion = $Matches[1]

          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag -and '${{ github.ref_type }}' -eq 'tag') { $tag = '${{ github.ref_name }}' }
          $dryRun = ('${{ github.event.inputs.dry_run }}' -eq 'true') -or (-not $tag)

          if ($tag) {
            if ($tag -notmatch '^v(\d+\.\d+(\.\d+)?)$') { throw "Tag '$tag' is not like v2.0." }
            if ($Matches[1] -ne $appVersion) { throw "Tag says $($Matches[1]) but the app says $appVersion. Fix one of them and tag again." }
          } else {
            $tag = "v$appVersion"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$appVersion" >> $env:GITHUB_OUTPUT
          "publish=$((-not $dryRun).ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "Release $tag (app version $appVersion); publish: $(-not $dryRun)"

      - name: Build the zip
        shell: pwsh
        run: ./tools/Build-Package.ps1

      # Short page: install lines, a one-paragraph summary, everything else folded away (tools/New-ReleaseNotes.ps1).
      - name: Build the release notes from CHANGELOG.md
        shell: pwsh
        run: ./tools/New-ReleaseNotes.ps1 -Version '${{ steps.version.outputs.version }}' -OutFile release-notes.md

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag Brave-Free-Origin.zip SHA256SUMS.txt --clobber
            gh release edit $tag --notes-file release-notes.md
          } else {
            gh release create $tag Brave-Free-Origin.zip SHA256SUMS.txt --title "Brave Free Origin $tag" --notes-file release-notes.md --verify-tag --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Dry run finished
        if: steps.version.outputs.publish != 'true'
        shell: pwsh
        run: 'Write-Host "Dry run: everything passed; nothing was published."'
