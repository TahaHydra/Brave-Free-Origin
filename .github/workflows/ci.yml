name: Validate and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Static checks: everything that can be verified without running the app.
  # ---------------------------------------------------------------------------
  validate:
    name: Static checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Windows PowerShell 5.1 -------------------------------------------
      # This is the production runtime: Brave-Free-Origin.bat launches
      # powershell.exe, not pwsh. Anything that only works under PowerShell 7
      # is broken for every user, so 5.1 is validated first and in full.
      - name: Parse every PowerShell script (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          $files = @('Brave-Free-Origin.ps1') + @(Get-ChildItem 'tools', 'install' -Filter '*.ps1' -File | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { Write-Host "Parse errors in $file"; $errors | Format-List *; $failed = $true }
          }
          if ($failed) { exit 1 }
          "Windows PowerShell $($PSVersionTable.PSVersion): $($files.Count) scripts parse OK"

      # Invoked the way the docs tell a maintainer to invoke it: no path
      # arguments. $PSScriptRoot is empty while param() defaults are evaluated
      # under 5.1, so a tool that only works with explicit paths would pass a
      # pwsh-only CI and fail on a real machine. -MinCoverage 95 means a shipped
      # translation may miss at most a handful of strings (they fall back to English).
      - name: Validate locales (Windows PowerShell 5.1, no path arguments)
        shell: powershell
        run: |
          .\tools\Test-Locales.ps1 -MinCoverage 95
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check generated en-US.json (Windows PowerShell 5.1, no arguments)
        shell: powershell
        run: |
          .\tools\Export-EnglishLocale.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $diff = git diff --name-only -- 'locales/en-US.json'
          if ($diff) {
            git --no-pager diff -- 'locales/en-US.json'
            throw 'locales/en-US.json is out of date. Run tools\Export-EnglishLocale.ps1 and commit the result.'
          }
          'en-US.json is current under Windows PowerShell 5.1'

      # The policy reference is generated from the same catalog the app uses,
      # so it can never describe something the app does not do.
      - name: Check generated docs/POLICIES.md
        shell: powershell
        run: |
          .\tools\Export-PolicyDocs.ps1
          $diff = git diff --name-only -- 'docs/POLICIES.md'
          if ($diff) {
            git --no-pager diff --stat -- 'docs/POLICIES.md'
            throw 'docs/POLICIES.md is out of date. Run tools\Export-PolicyDocs.ps1 and commit the result.'
          }
          'docs/POLICIES.md is current'

      # --- PowerShell 7 -----------------------------------------------------
      # Not the shipping runtime, but a cheap second opinion: it catches
      # constructs that changed meaning between hosts, and the exporter's
      # output must be byte-identical under both (hence the ordinal key sort).
      - name: Parse every PowerShell script (PowerShell 7)
        shell: pwsh
        run: |
          $failed = $false
          $files = @('Brave-Free-Origin.ps1') + @(Get-ChildItem 'tools', 'install' -Filter '*.ps1' -File | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { Write-Host "Parse errors in $file"; $errors | Format-List *; $failed = $true }
          }
          if ($failed) { exit 1 }
          "PowerShell $($PSVersionTable.PSVersion): $($files.Count) scripts parse OK"

      - name: Validate locales (PowerShell 7)
        shell: pwsh
        run: |
          ./tools/Test-Locales.ps1 -MinCoverage 95
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check generated en-US.json is host-independent (PowerShell 7)
        shell: pwsh
        run: |
          ./tools/Export-EnglishLocale.ps1
          $diff = git diff --name-only -- 'locales/en-US.json'
          if ($diff) {
            git --no-pager diff -- 'locales/en-US.json'
            throw 'tools/Export-EnglishLocale.ps1 produced different output under PowerShell 7 than under Windows PowerShell 5.1. The generator must be deterministic across hosts.'
          }
          'en-US.json is identical under PowerShell 7'

      # --- Encoding guards --------------------------------------------------
      # Windows PowerShell 5.1 decodes a BOM-less .ps1 with the system ANSI
      # code page. Any non-ASCII byte in the app would mojibake on machines
      # whose code page differs from the author's, so translated text must
      # live in locales\*.json and these files must stay pure ASCII. The
      # one-line installer is also served over HTTP, where 5.1 guesses the
      # charset, which is a second reason.
      - name: Enforce ASCII-only PowerShell that end users run
        shell: pwsh
        run: |
          foreach ($file in @('Brave-Free-Origin.ps1', 'install/bfo.ps1')) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $file))
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "$file has a UTF-8 BOM. It must be saved without one."
            }
            $bad = @()
            $line = 1
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 0x0A) { $line++ }
              elseif ($bytes[$i] -gt 127) { $bad += $line }
            }
            if ($bad.Count -gt 0) {
              throw "Non-ASCII bytes in $file at line(s): $(($bad | Select-Object -Unique -First 10) -join ', '). Put translated text in locales\*.json instead."
            }
          }
          'ASCII check OK'

      # Locale files are the one place UTF-8 is expected. A BOM or a UTF-16
      # file would be silently mis-decoded by the runtime loader.
      - name: Enforce UTF-8 without BOM on locale files
        shell: pwsh
        run: |
          foreach ($file in (Get-ChildItem 'locales' -Filter '*.json' -File)) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "$($file.Name) has a UTF-8 BOM. Save it without one."
            }
            if ($bytes.Length -ge 2 -and (($bytes[0] -eq 0xFF -and $bytes[1] -eq 0xFE) -or ($bytes[0] -eq 0xFE -and $bytes[1] -eq 0xFF))) {
              throw "$($file.Name) looks like UTF-16. Locale files must be UTF-8."
            }
            $strict = New-Object System.Text.UTF8Encoding($false, $true)
            try { [void]$strict.GetString($bytes) }
            catch { throw "$($file.Name) is not valid UTF-8." }
          }
          'Locale encoding OK'

      - name: Check launcher target
        shell: pwsh
        run: |
          if (-not (Test-Path 'Brave-Free-Origin.bat')) { throw 'Launcher is missing.' }
          if (-not (Test-Path 'Brave-Free-Origin.ps1')) { throw 'PowerShell app is missing.' }
          $bat = Get-Content 'Brave-Free-Origin.bat' -Raw
          if ($bat -notmatch 'Brave-Free-Origin\.ps1') { throw 'Launcher does not reference Brave-Free-Origin.ps1.' }
          'Launcher check OK'

  # ---------------------------------------------------------------------------
  # Runs the whole app in its sandbox: policies go to a throw-away HKCU hive,
  # the hosts file is a temp file, scheduled tasks and services are fakes, no
  # UAC prompt and no real Brave install is touched. See tools\Test-App.ps1.
  # ---------------------------------------------------------------------------
  selftest:
    name: App self-test (sandbox)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the sandboxed self-test (Windows PowerShell 5.1)
        shell: powershell
        env:
          BFO_TEST_OUT: ${{ runner.temp }}\bfo-selftest
        run: |
          $settings = Join-Path $env:RUNNER_TEMP 'bfo-settings\settings.json'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Brave-Free-Origin.ps1 `
            -Lang en-US -BfoSettingsPath $settings -SelfTest .\tools\Test-App.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: ${{ runner.temp }}\bfo-selftest
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The one-line installer (irm https://xhydra.fr/bfo | iex), tested against a
  # fake GitHub on loopback. No network, no UAC, no real install.
  # ---------------------------------------------------------------------------
  bootstrap:
    name: One-line installer tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          .\tools\Test-Bootstrap.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer tests (PowerShell 7)
        shell: pwsh
        run: |
          ./tools/Test-Bootstrap.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ---------------------------------------------------------------------------
  # The portable zip is a build output, not a tracked source file.
  # tools\Build-Package.ps1 decides what ships and verifies it; the release
  # workflow calls the same script.
  # ---------------------------------------------------------------------------
  package:
    name: Build portable zip
    runs-on: windows-latest
    needs: [validate, selftest, bootstrap]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify the zip
        shell: pwsh
        run: ./tools/Build-Package.ps1

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: Brave-Free-Origin
          path: |
            Brave-Free-Origin.zip
            SHA256SUMS.txt
