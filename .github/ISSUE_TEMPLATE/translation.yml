name: Translation fix or new language
description: A word reads badly, a string is missing, or you would like to add a language
labels: [documentation, help wanted]
body:
  - type: markdown
    attributes:
      value: |
        Translations live in `locales/<code>.json`. You can send a pull request directly (see [TRANSLATING.md](https://github.com/TahaHydra/Brave-Free-Origin/blob/main/TRANSLATING.md)) or just tell us what is wrong here.
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "Français (fr-FR)"
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where is it, and what should it say?
      description: Give the text as shown in the window (or the key from `locales/en-US.json`, for example `policy.BraveRewardsDisabled.description`), what is wrong with it, and your suggestion.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Can you review a whole file?
      description: A native speaker reading a file top to bottom is the most useful help we can get.
      options:
        - "Yes, I would like to review it"
        - "No, just reporting this one string"
        - "I want to add a new language"
    validations:
      required: false
